name: Build Heart Monitor R09 HID APK

on:
  push:
    branches: [ heart-monitor-r09-hid ]
    paths:
      - 'heart-monitor-android-hid/**'
      - '.github/workflows/heart-monitor-hid-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heart-monitor-android-hid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HeartMonitor-R09-HID-debug
          path: heart-monitor-android-hid/app/build/outputs/apk/debug/app-debug.apk
