<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1254b5"><title>SKF Kardex | Catalogo</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#18243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#1254b5;color:white;padding:18px 16px}header .inner,main{max-width:900px;margin:auto}header .inner{display:flex;align-items:center;gap:12px}header img{height:50px;width:50px;object-fit:contain;background:white;border-radius:10px}h1{font-size:1.3rem;margin:0}header p{margin:3px 0 0;color:#dce9ff;font-size:.9rem}main{padding:16px}.panel{background:white;border:1px solid #dfe6f1;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px #1020400c}input{width:100%;border:1px solid #bfcbe0;border-radius:12px;padding:14px;font:inherit}button{font:inherit;cursor:pointer}.type{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px;border:1px solid #dce5f3;background:#fff;border-radius:12px;margin:8px 0;text-align:left;font-weight:700;color:#172f57}.type span{color:#5a6980;font-size:.85rem;font-weight:400}.type:hover,.type:focus-visible{background:#e9f2ff;border-color:#1254b5}.back{background:#e8f0fc;color:#1254b5;border:0;border-radius:10px;padding:11px 14px;margin-bottom:12px;font-weight:700}.tray{border:1px solid #dce5f3;border-radius:14px;padding:13px;margin-top:12px}.tray h3{margin:0 0 12px;color:#1254b5}.positions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.position{border:1px solid #cbd8e9;background:#f6f9ff;border-radius:12px;padding:12px;min-height:100px;overflow-wrap:anywhere}.position strong{display:block;margin-bottom:9px}.component{display:block;background:white;border:1px solid #e0e8f3;border-radius:8px;padding:8px;margin:6px 0;font-size:.92rem}.chosen{border:2px solid #1254b5}.other{margin-top:12px}.other li{margin:8px 0}.muted{color:#64748b;font-size:.9rem}.error{color:#a11e29}#status{margin-bottom:10px}@media(max-width:540px){.positions{grid-template-columns:1fr}.position{min-height:0}header img{height:42px;width:42px}}
body{background:linear-gradient(150deg,#f8fbff,#e2edf9)}header{background:linear-gradient(110deg,#003b79,#005195);border-bottom:4px solid #df402d}.panel{border-top:3px solid #005195}</style></head><body>
<header><div class="inner"><img src="assets/icon-192.png" alt="SKF"><div><h1>SKF Kardex Viewer</h1><p>Catalogo condiviso · sola consultazione</p></div></div></header>
<main><div class="panel" id="catalogPanel"><label for="search"><strong>Cerca una tipologia</strong></label><input id="search" type="search" placeholder="Digita un codice o una tipologia…" autocomplete="off"><p class="muted" id="total"></p><div id="types"></div></div><div class="panel" id="detailPanel" hidden><button class="back" id="back">← Tutte le tipologie</button><h2 id="selected"></h2><p class="muted" id="summary"></p><div id="trays"></div></div><p id="status" role="status" class="muted">Collegamento all’inventario condiviso…</p><button class="back" type="button" onclick="location.reload()">↻ Aggiorna inventario</button></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').trim().toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
let rows=[],types=[];
const trayKey=s=>String(s??'').trim(), position=s=>{let p=norm(s);return p.includes('sinist')||/\bsx\b/.test(p)?'Sinistra':p.includes('centr')||/\bct\b/.test(p)?'Centrale':p.includes('destr')||/\bdx\b/.test(p)?'Destra':'Da definire'};
const unique=a=>[...new Set(a)];
function renderList(){let q=norm($('search').value);let list=types.filter(t=>norm(t).includes(q));$('total').textContent=`${list.length} tipologie${q?' trovate':' disponibili'}`;$('types').replaceChildren();for(let t of list){let b=document.createElement('button');b.className='type';let n=unique(rows.filter(r=>r.TIPO===t).map(r=>trayKey(r.RIPIANO))).length;b.innerHTML=`<strong>${esc(t)}</strong><span>${n} ripian${n===1?'o':'i'} ›</span>`;b.addEventListener('click',()=>showType(t));$('types').append(b)}if(!list.length)$('types').textContent='Nessuna tipologia trovata.'}
function showType(t){$('catalogPanel').hidden=true;$('detailPanel').hidden=false;$('selected').textContent=t;let matches=rows.filter(r=>r.TIPO===t);let trays=unique(matches.map(r=>trayKey(r.RIPIANO)));$('summary').textContent=`Presente in ${trays.length} ripian${trays.length===1?'o':'i'}. Seleziona il vassoio indicato sulla macchina.`;$('trays').innerHTML='';for(let tray of trays){let contents=rows.filter(r=>trayKey(r.RIPIANO)===tray);let box=document.createElement('section');box.className='tray';let html=`<h3>Ripiano / vassoio ${esc(tray)}</h3><div class="positions">`;for(let side of ['Sinistra','Centrale','Destra']){let here=contents.filter(r=>position(r.POSIZIONE)===side);html+=`<div class="position"><strong>${side}</strong>${here.length?here.map(r=>`<span class="component ${r.TIPO===t?'chosen':''}">${esc(r.TIPO)}</span>`).join(''):'<span class="muted">Nessun componente indicato</span>'}</div>`}html+='</div>';let extra=contents.filter(r=>position(r.POSIZIONE)==='Da definire');if(extra.length)html+=`<div class="other"><strong>Posizione da definire</strong><ul>${extra.map(r=>`<li>${esc(r.TIPO)} — ${esc(r.POSIZIONE||'Non indicata')}</li>`).join('')}</ul></div>`;box.innerHTML=html;$('trays').append(box)}history.replaceState(null,'',`#tipo=${encodeURIComponent(t)}`);window.scrollTo(0,0)}
$('search').addEventListener('input',renderList);$('back').addEventListener('click',()=>{$('detailPanel').hidden=true;$('catalogPanel').hidden=false;history.replaceState(null,'',location.pathname+location.search)});
fetch('https://skf-kardex-api.vocidicassino.workers.dev/api/componenti',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data.componenti))throw Error('Formato inventario Cloud non valido');data=data.componenti;rows=data.filter(r=>r&&typeof r==='object').map(r=>({RIPIANO:String(r.ripiano??''),TIPO:String(r.tipo??'').trim(),POSIZIONE:String(r.posizione??'')})).filter(r=>r.TIPO);types=unique(rows.map(r=>r.TIPO)).sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));$('status').textContent=`Inventario condiviso aggiornato: ${rows.length} componenti.`;renderList();let t=new URLSearchParams(location.hash.slice(1)).get('tipo');if(t&&types.includes(t))showType(t)}).catch(e=>{$('status').className='error';$('status').textContent='Impossibile collegarsi all’inventario condiviso: '+e.message});
})();
</script></body></html>
