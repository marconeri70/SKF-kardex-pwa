plugins { id 'com.android.application' }

android {
    namespace 'it.marconeri.heartmonitorhid'
    compileSdk 35
    defaultConfig {
        applicationId 'it.marconeri.heartmonitorhid'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '5.0-sequence-multigesture'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
